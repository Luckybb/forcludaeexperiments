# Decap CMS settings for the BNC blog.
# Login uses GitHub through Netlify (see BLOG-GUIDE.md for the one-time setup).
backend:
  name: github
  repo: luckybb/forcludaeexperiments
  branch: claude/bnc-apparel-site-recreation-ni25ng
  commit_messages:
    create: "Blog: add {{slug}}"
    update: "Blog: update {{slug}}"
    delete: "Blog: delete {{slug}}"
    uploadMedia: "Blog: upload {{path}}"
    deleteMedia: "Blog: delete {{path}}"

site_url: https://www.bncapparel.site
display_url: https://www.bncapparel.site
logo_url: https://www.bncapparel.site/icon-192.png
locale: en

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: Write, edit and publish blog posts. They appear at bncapparel.site/blog/ a minute or two after you publish.
    folder: content/blog
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}} ({{date | date('YYYY-MM-DD')}})"
    fields:
      - { label: Title, name: title, widget: string, hint: "The headline. Include the main phrase people would search, e.g. 'How to price a T-shirt'." }
      - { label: Description, name: description, widget: text, hint: "1 to 2 sentences, about 150 characters. Shown on Google under the title and on the blog page." }
      - { label: Publish date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Author, name: author, widget: string, default: BNC }
      - { label: Cover image, name: cover, widget: image, required: false, hint: "Wide image, about 1600 x 900 px, JPG or WebP under 300 KB." }
      - { label: Cover image description (alt text), name: cover_alt, widget: string, required: false, hint: "Describe the image for Google and screen readers." }
      - { label: Tags, name: tags, widget: list, required: false, hint: "Comma separated, e.g. Shopify, Print on demand" }
      - { label: SEO title (optional), name: seo_title, widget: string, required: false, hint: "Custom title for Google, under 60 characters. Leave empty to use the title." }
      - { label: Draft (hide from the site), name: draft, widget: boolean, default: false, required: false }
      - { label: Post, name: body, widget: markdown }

